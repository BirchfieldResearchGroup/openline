# Tables 1 and 7: conductors by size in cmils, their wires, nominal diameter, mass and rated
# strength by stranding, in inch-pound units (table 7's kg/km and kN are soft conversions,
# note 1); table 2, by metric size, in SI units. Each row gives its conductor's wires one
# diameter, aluminum 1350 and alloy 6201 alike. Table 6's rating factors, a layer of both
# metals counting as one of each (note A), 6.1's lay ratio for each layer, 13.5 preferred, and
# 6.2's hand are the strandings of openline.types.conductors.astm.B524; 8.1's stress for each
# metal is its stress. Table 8's increments by size approximate what the lay gives (10.1,
# note 4), as openline.mechanical calculates it.
