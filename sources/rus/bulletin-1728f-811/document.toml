# Bulletin 1728F-811, published 1999-04-09. p. 7: "The drawings provided in this
# specification include wood pole structures". Heights are below the pole tops: the line sets
# the poles. Points are in the drawing's plane: along is 0. Shield wires are held in clamps.
# Families by the index, p. 175-176: "Tangent H-Frame".
# TH-230, p. 84: X-arm #81 is "3-5/8" x 9-3/8" solid sawn" (note 3), a double 40'-0" arm. Its
# braces print no material, its steel OHGW arm no section (drawing TM-7D), and its X-brace's
# "A" is left blank (note 4; p. 164), so they are not entered. TH-230X is TH-230 "with one
# additional X-Brace" (note 5).
# TH-1A, p. 67: item 1 is a 5-5/8" x 7-3/8" x 26'-0" crossarm (#55, TCD-26).
# Pole centers are 12'-6" apart. Pole lengths, sections and foundations are selected by the
# line (note 3): a pole is given by its top.

