# p. 1: "manufactured in accordance with the requirements of the latest issue of ASTM B779";
# trapezoidal "aluminum 1350-H19 wires", their diameters those of round wires of equal area.
# Strengths are printed for GA2, "GA3 (HS)" and "GA5 (UHS)" cores.
# Left out as misprinted: p. 4, the code word "Calument".
# AC resistances at 60 Hz, as note 5 gives the frequency; note 4: "AC resistance for single-layer
# and three-layer designs approximates the effects of core magnetization".
# p. 1 draws each stranding's layers: 18/7, 20/7, 21/7 and 22/7 in two; 36/7, 36/19, 38/19 and
# 39/19 in three; 64/19 in four. They are entered for the rows of those strandings, the others
# left blank. The conductor's diameter is its aluminum's outside diameter.
# Left out: the rows of Oriole, Hen, Rook, Tern, Condor, Cardinal, Ortolan, Curlew, Bunting,
# Bittern, Dipper, Plover, Lapwing, Chukar, Mystic, Columbia, Hudson, Yukon, Nelson, Mackenzie,
# Miramichi, Platte, Schuylkill, James, Pee Dee, Athabaska, Santee, code words the catalog holds
# with other wires, the construction openline's calculations agree with best.

