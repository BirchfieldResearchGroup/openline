version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  jobs:
    build:
      html:  # as CI builds it, its doctrees kept out of the published site
        - $READTHEDOCS_VIRTUALENV_PATH/bin/python -m sphinx -W --keep-going -j auto -b html -d _build/doctrees docs $READTHEDOCS_OUTPUT/html

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/conf.py
